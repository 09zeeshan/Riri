  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      color: #fff;
      margin: 0;
      overflow-x: hidden;
      background: linear-gradient(-45deg, #140e36, #2d1445, #112a45, #360e22); /* Matches Royal Agents */
    }

    #welcome-page {
      position: relative;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .background-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0.8; /* Blend with gradient */
    }

    .hero-content {
      position: relative;
      text-align: center;
      z-index: 1;
      opacity: 1; /* Ensure visible */
      
    }

    .hero-content h1 {
      font-size: 3.5em;
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(45deg, #FF007A, #9D00FF, #00E5FF); /* Matches Royal Agents */

      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
    }

    .button {
      display: inline-block;
      padding: 8px 16px; /* Matches Royal Agents */
      color: #fff;
      background: linear-gradient(45deg, #FF007A, #9D00FF, #00E5FF);
      border: none;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.9em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .button:hover {
      background: linear-gradient(45deg, #00E5FF, #9D00FF, #FF007A);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 229, 255, 0.4);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .hero-content h1 {
        font-size: 2.2em;
      }

      .button {
        padding: 6px 12px;
        font-size: 0.8em;
      }
    }
   .dg { display: none !important; } .promo { display: none !important; }
    .hero-content h1 {
      animation: fadeInDown 1.2s ease-out, glowPulse 3s infinite alternate;
    }
    .button {
      animation: fadeInUp 1.2s ease-out;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
    }
    .button:hover {
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.6), 0 0 40px rgba(255, 0, 122, 0.4);
      transform: translateY(-3px) scale(1.05);
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes glowPulse {
      0% { text-shadow: 0 0 10px rgba(255, 0, 122, 0.5); }
      100% { text-shadow: 0 0 20px rgba(0, 229, 255, 0.8), 0 0 30px rgba(255, 0, 122, 0.6); }
    }
    .background-video {
      animation: videoFade 2s ease-in;
    }
    @keyframes videoFade {
      from { opacity: 0; filter: blur(10px); }
      to { opacity: 0.8; filter: blur(0); }
    }
</style>
